services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: forge:0.1.0
    volumes:
      - .:/work
    working_dir: /work
    entrypoint: ["forge"]
    command: ["--help"]

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: forge:0.1.0-dev
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true
    entrypoint: ["bash"]

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: forge:0.1.0-dev
    working_dir: /app
    command: ["python", "-m", "pytest", "-q", "--tb=line"]
