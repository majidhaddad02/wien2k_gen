<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280">
<title>FORGE high-level architecture (hand-laid SVG fallback)</title>
<rect width="760" height="280" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
<text x="20" y="18" font-size="12" font-family="sans-serif">Solid boxes/arrows: verified static relationships. See architecture_overview.mmd.</text>
<rect x="40" y="30" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="50" y="60" font-size="11" font-family="sans-serif">Entry: cli / __main__ / wizard / cli_sbatch</text>
<rect x="40" y="110" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="50" y="140" font-size="11" font-family="sans-serif">CLI: argparse + get_handler</text>
<rect x="40" y="190" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="50" y="220" font-size="11" font-family="sans-serif">Pipeline: run_pipeline / build_auto</text>
<rect x="280" y="110" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="290" y="140" font-size="11" font-family="sans-serif">Advisor + hardware + scheduler</text>
<rect x="280" y="190" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="290" y="220" font-size="11" font-family="sans-serif">Backends: WIEN2k / QE / VASP / CP2K</text>
<rect x="520" y="110" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="530" y="140" font-size="11" font-family="sans-serif">Submit: slurm / pbs / lsf</text>
<rect x="520" y="190" width="200" height="50" fill="#f7f7f7" stroke="#333"/>
<text x="530" y="220" font-size="11" font-family="sans-serif">External: run_lapw, sbatch, pw.x</text>
<line x1="140" y1="80" x2="140" y2="110" stroke="#333" marker-end="url(#arrow)"/>
<line x1="140" y1="160" x2="140" y2="190" stroke="#333" marker-end="url(#arrow)"/>
<line x1="240" y1="135" x2="280" y2="135" stroke="#333" marker-end="url(#arrow)"/>
<line x1="140" y1="215" x2="280" y2="215" stroke="#333" marker-end="url(#arrow)"/>
<line x1="480" y1="135" x2="520" y2="135" stroke="#333" marker-end="url(#arrow)"/>
<line x1="480" y1="215" x2="520" y2="215" stroke="#333" marker-end="url(#arrow)"/>
<line x1="620" y1="160" x2="620" y2="190" stroke="#333" marker-end="url(#arrow)"/>
</svg>
